# ============================================
# Docker Compose — Deepfake & Media Forensics Platform
# ============================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepfake}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/deepfake}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-in-production}
      DETECTION_PROVIDER: ${DETECTION_PROVIDER:-demo}
      RESEMBLE_API_KEY: ${RESEMBLE_API_KEY:-}
      SIGHTENGINE_API_USER: ${SIGHTENGINE_API_USER:-}
      SIGHTENGINE_API_SECRET: ${SIGHTENGINE_API_SECRET:-}
      REALITY_DEFENDER_API_KEY: ${REALITY_DEFENDER_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-'["http://localhost:3000","http://localhost:5173"]'}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      DEBUG: ${DEBUG:-true}
    volumes:
      - upload_data:/app/uploads
      - ./backend/app:/app/app
      - ./backend/alembic/versions:/app/alembic/versions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/deepfake}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-in-production}
      DETECTION_PROVIDER: ${DETECTION_PROVIDER:-demo}
      RESEMBLE_API_KEY: ${RESEMBLE_API_KEY:-}
      SIGHTENGINE_API_USER: ${SIGHTENGINE_API_USER:-}
      SIGHTENGINE_API_SECRET: ${SIGHTENGINE_API_SECRET:-}
      REALITY_DEFENDER_API_KEY: ${REALITY_DEFENDER_API_KEY:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      - upload_data:/app/uploads
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  upload_data:
